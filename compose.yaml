services:
  app:
    build:
      context: .
    environment:
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?Configure APP_PASSWORD_HASH in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:?Configure SESSION_SECRET in .env}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - health_archive_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  health_archive_data:
    name: health_archive_data
